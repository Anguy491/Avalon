name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build all workspaces
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Contract tests
        run: pnpm test:contract
      - name: Dependency integration tests
        run: pnpm test:integration
      - name: Documentation and generated schemas
        run: pnpm docs:check
      - name: Secret scan
        run: pnpm secret:scan
      - name: Security regression tests
        run: pnpm test:security
      - name: Preview validator fixtures
        run: node --test scripts/preview-config.test.mjs
      - name: Preview deployment boundary
        run: pnpm deploy:preview:check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker-container
      - name: Build immutable server OCI artifact with SBOM and provenance
        run: >-
          docker buildx build . --file apps/server/Dockerfile
          --output type=oci,dest=avalon-server.oci
          --metadata-file=avalon-server-metadata.json
          --sbom=true --provenance=mode=max
      - name: Record server image digest
        run: sha256sum avalon-server.oci > avalon-server.oci.sha256
      - name: Upload OCI, SBOM and provenance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: avalon-server-oci-${{ github.sha }}
          path: |
            avalon-server.oci
            avalon-server.oci.sha256
            avalon-server-metadata.json
          if-no-files-found: error
          retention-days: 14

  publish-server-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker-container
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=ghcr.io/${owner}/avalon-server" >> "$GITHUB_OUTPUT"
          echo "migrator=ghcr.io/${owner}/avalon-migrator" >> "$GITHUB_OUTPUT"
      - name: Build and publish server image
        shell: bash
        run: |
          docker buildx build . \
            --file apps/server/Dockerfile \
            --target runtime \
            --tag "${{ steps.images.outputs.server }}:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --push \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file=avalon-server-metadata.json
      - name: Build and publish migration image
        shell: bash
        run: |
          docker buildx build . \
            --file apps/server/Dockerfile \
            --target migrator \
            --tag "${{ steps.images.outputs.migrator }}:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --push \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file=avalon-migrator-metadata.json
      - name: Record immutable deployment references
        shell: bash
        run: |
          server_digest="$(node -p 'JSON.parse(require("fs").readFileSync("avalon-server-metadata.json"))["containerimage.digest"]')"
          migrator_digest="$(node -p 'JSON.parse(require("fs").readFileSync("avalon-migrator-metadata.json"))["containerimage.digest"]')"
          {
            echo "AVALON_SERVER_IMAGE=${{ steps.images.outputs.server }}@${server_digest}"
            echo "AVALON_MIGRATOR_IMAGE=${{ steps.images.outputs.migrator }}@${migrator_digest}"
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
          } > avalon-preview-images.env
      - name: Upload immutable deployment manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: avalon-preview-images-${{ github.sha }}
          path: |
            avalon-preview-images.env
            avalon-server-metadata.json
            avalon-migrator-metadata.json
          if-no-files-found: error
          retention-days: 30
