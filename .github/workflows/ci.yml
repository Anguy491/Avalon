name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build all workspaces
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Contract tests
        run: pnpm test:contract
      - name: Dependency integration tests
        run: pnpm test:integration
      - name: Documentation and generated schemas
        run: pnpm docs:check
      - name: Secret scan
        run: pnpm secret:scan
      - name: Security regression tests
        run: pnpm test:security
      - name: Preview validator fixtures
        run: node --test scripts/preview-config.test.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: docker-container
      - name: Build immutable server OCI artifact with SBOM and provenance
        run: >-
          docker buildx build . --file apps/server/Dockerfile
          --output type=oci,dest=avalon-server.oci
          --metadata-file=avalon-server-metadata.json
          --sbom=true --provenance=mode=max
      - name: Record server image digest
        run: sha256sum avalon-server.oci > avalon-server.oci.sha256
      - name: Upload OCI, SBOM and provenance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: avalon-server-oci-${{ github.sha }}
          path: |
            avalon-server.oci
            avalon-server.oci.sha256
            avalon-server-metadata.json
          if-no-files-found: error
          retention-days: 14
