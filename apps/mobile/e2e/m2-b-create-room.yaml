appId: com.example.avalon.dev
name: M2 create room happy path
---
- clearKeychain
- launchApp:
    clearState: true
- openLink: 'exp+avalon-dev://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    point: '68%,54%'
    optional: true
- tapOn:
    text: 'Wait'
    optional: true
- tapOn:
    text: 'http://127.0.0.1:8081'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Reload'
    optional: true
- tapOn:
    text: 'Close'
    optional: true
- assertVisible: '聚会无实体阿瓦隆助手'
- tapOn: '你的昵称'
- inputText: 'Arthur'
- hideKeyboard
- tapOn: '创建房间'
- assertVisible: '目标人数'
- assertVisible: '已选择 · 基础配置'
- assertVisible: '推荐配置'
- assertVisible: '自定义'
- tapOn: '增加人数'
- assertVisible: '6 人'
- tapOn: '推荐配置'
- assertVisible: '已选择 · 推荐配置'
- tapOn:
    id: 'create-room-submit'
- assertVisible: '房间号'
- assertVisible: 'Arthur · 房主'
- assertVisible: '我已准备'
