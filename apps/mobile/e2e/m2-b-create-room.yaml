appId: com.example.avalon.dev
name: M2 create room happy path
---
- launchApp:
    clearState: true
- openLink: 'exp+avalon-dev://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    point: '68%,54%'
    optional: true
- tapOn:
    text: 'Wait'
    optional: true
- tapOn:
    text: 'http://127.0.0.1:8081'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Reload'
    optional: true
- assertVisible: '让手机保管秘密'
- tapOn: '你的昵称'
- inputText: 'Arthur'
- hideKeyboard
- tapOn: '创建房间'
- assertVisible: '目标人数'
- assertVisible: '经典预设'
- tapOn: '增加人数'
- assertVisible: '6 人'
- tapOn:
    id: 'create-room-submit'
- assertVisible: '房间号'
- assertVisible: 'Arthur · 房主'
- assertVisible: 'M2 仅提供创建、加入与实时大厅投影；准备、改座次和开始游戏将在 M3 开放。'
