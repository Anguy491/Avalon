appId: com.example.avalon.dev
name: M2 create room with a custom role deck
---
- clearKeychain
- launchApp:
    clearState: true
- openLink: 'exp+avalon-dev://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    point: '68%,54%'
    optional: true
- tapOn:
    text: 'Wait'
    optional: true
- tapOn:
    text: 'http://127.0.0.1:8081'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Reload'
    optional: true
- tapOn:
    text: 'Close'
    optional: true
- assertVisible: '让手机保管秘密'
- tapOn: '你的昵称'
- inputText: 'CustomHost'
- hideKeyboard
- tapOn: '创建房间'
- tapOn: '自定义'
- assertVisible: '已选 0 个角色；目标人数为 5 人。服务器会执行完整规则校验。'
- tapOn: '增加梅林'
- tapOn: '增加派西维尔'
- tapOn: '增加忠臣'
- scrollUntilVisible:
    element:
      text: '增加刺客'
    direction: DOWN
- tapOn: '增加刺客'
- scrollUntilVisible:
    element:
      text: '增加莫甘娜'
    direction: DOWN
- tapOn: '增加莫甘娜'
- scrollUntilVisible:
    element:
      id: 'create-room-submit'
    direction: DOWN
- tapOn:
    id: 'create-room-submit'
- assertVisible: '房间号'
- assertVisible: 'CustomHost · 房主'
