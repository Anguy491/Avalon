appId: com.example.avalon.dev
name: M0 navigation smoke
---
- launchApp:
    clearState: false
- openLink: 'exp+avalon-dev://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081'
- tapOn:
    text: 'Wait'
    optional: true
- tapOn:
    text: 'http://127.0.0.1:8081'
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    text: 'Reload'
    optional: true
- assertVisible: '让手机保管秘密'
- tapOn: '创建房间'
- assertVisible: 'M0 已建立页面和布局回路。人数、角色预设与昵称表单将在 M2 实现，并由服务端最终校验。'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'BackButton'
- tapOn: '扫描二维码'
- assertVisible: '改用房间号'
